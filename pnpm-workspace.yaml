allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
strictDepBuilds: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # Before adding a new entry, try removing old ones to see whether
  # they are still needed after upstream dependencies update.
  # Fixes CVE-2026-13149, CVE-2026-14257, and CVE-2026-69152
  # (Dependabot alerts #1, #3, and #4):
  # https://github.com/esafak/pi-reviewer/security/dependabot/1
  # https://github.com/esafak/pi-reviewer/security/dependabot/3
  # https://github.com/esafak/pi-reviewer/security/dependabot/4
  brace-expansion@^5.0.0: 5.0.9
  # Fixes CVE-2026-59877 (Dependabot alert #2):
  # https://github.com/esafak/pi-reviewer/security/dependabot/2
  protobufjs@^7.6.0: 7.6.6
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
