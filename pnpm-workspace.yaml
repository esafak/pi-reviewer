# pnpm 11 config: approve build scripts for native/postinstall deps.
# onlyBuiltDependencies was removed in v11 and replaced by allowBuilds
# (see https://pnpm.io/settings). strictDepBuilds defaults to true in v11,
# making unapproved build scripts a hard error — set false so any future
# unapproved package degrades to a warning instead of failing CI.
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
strictDepBuilds: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
