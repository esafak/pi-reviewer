name: "pi-reviewer"
description: "AI-powered PR reviewer using the pi agent — model-agnostic"
author: "zeflq"

inputs:
  github-token:
    description: "GitHub token to post PR comments."
    required: true

  pi-api-key:
    description: "API key for the chosen model's provider (e.g. an Anthropic key for anthropic/* models, a DeepSeek key for deepseek/*). Used as the explicit key, overriding per-provider env vars."
    required: true

  model:
    description: "Model to use in provider/modelId format (e.g. openrouter/openai/gpt-5.4-mini)"
    required: true

  thinking:
    description: "Thinking budget: off, minimal, low, medium, high, or xhigh (default: off)"
    required: false
    default: "off"

  min-severity:
    description: "Minimum severity level to report: info, warn, or critical (default: info)"
    required: false
    default: "info"

  doc-dirs:
    description: "Comma-separated dirs to scan for matching docs to inject into the review (e.g. '.pi/notes,docs/review'). Empty = inject nothing."
    required: false
    default: ""

  review-drafts:
    description: "Review draft pull requests (default: false)."
    required: false
    default: "false"

  react-on-no-findings:
    description: "Leave a thumbs-up reaction on the pull request instead of posting a comment when no new findings remain and all existing findings are resolved (default: true)."
    required: false
    default: "true"

  setup-node:
    description: "Set up Node via actions/setup-node when a compatible Node is not already on PATH. Set to false to require the runner to provide Node 24 or newer."
    required: false
    default: "true"

  cache:
    description: "Cache the pnpm store across runs. Set to false to disable (e.g. on runners where the cache service is unavailable)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Detect preinstalled toolchain
      id: toolchain
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        node_ready=false
        if command -v node >/dev/null 2>&1; then
          major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || true)
          case "$major" in
            ''|*[!0-9]*) ;;
            *) [ "$major" -ge 24 ] && node_ready=true ;;
          esac
        fi

        expected_pnpm=$(awk -F'"' '/"packageManager"/ { split($4, parts, "@"); print parts[2]; exit }' package.json)
        pnpm_ready=false
        if command -v pnpm >/dev/null 2>&1; then
          actual_pnpm=$(pnpm --version 2>/dev/null || true)
          [ "$actual_pnpm" = "$expected_pnpm" ] && pnpm_ready=true
        fi

        expected_vite_plus=$(awk '$1 == "vite-plus:" { print $2; exit }' pnpm-workspace.yaml)
        vite_plus_ready=false
        if command -v vp >/dev/null 2>&1; then
          # vp currently reports `vp v<version>` on its first output line.
          actual_vite_plus=$(vp --version 2>/dev/null | awk 'NR == 1 { sub(/^v/, "", $2); print $2; exit }' || true)
          is_version_at_least() {
            local actual="$1" minimum="$2"
            local actual_core="${actual%%-*}" minimum_core="${minimum%%-*}"
            local actual_major actual_minor actual_patch minimum_major minimum_minor minimum_patch
            IFS=. read -r actual_major actual_minor actual_patch <<< "$actual_core"
            IFS=. read -r minimum_major minimum_minor minimum_patch <<< "$minimum_core"
            actual_major=${actual_major:-0}; actual_minor=${actual_minor:-0}; actual_patch=${actual_patch:-0}
            minimum_major=${minimum_major:-0}; minimum_minor=${minimum_minor:-0}; minimum_patch=${minimum_patch:-0}
            case "$actual_major.$actual_minor.$actual_patch.$minimum_major.$minimum_minor.$minimum_patch" in
              *[!0-9.]*) return 1 ;;
            esac
            if [ "$actual_major" -gt "$minimum_major" ] || \
              { [ "$actual_major" -eq "$minimum_major" ] && [ "$actual_minor" -gt "$minimum_minor" ]; } || \
              { [ "$actual_major" -eq "$minimum_major" ] && [ "$actual_minor" -eq "$minimum_minor" ] && [ "$actual_patch" -gt "$minimum_patch" ]; }; then
              return 0
            fi
            if [ "$actual_major" -ne "$minimum_major" ] || [ "$actual_minor" -ne "$minimum_minor" ] || [ "$actual_patch" -ne "$minimum_patch" ]; then
              return 1
            fi
            # A prerelease has lower precedence than the corresponding stable
            # release, so 0.3.0-beta must not satisfy a 0.3.0 minimum.
            case "$actual" in
              *-*) case "$minimum" in *-*) return 0 ;; *) return 1 ;; esac ;;
              *) return 0 ;;
            esac
          }
          if [ -n "$actual_vite_plus" ] && [ -n "$expected_vite_plus" ] && is_version_at_least "$actual_vite_plus" "$expected_vite_plus"; then
            vite_plus_ready=true
          fi
        fi

        printf 'Toolchain availability: node=%s pnpm=%s vite-plus=%s\n' \
          "$node_ready" "$pnpm_ready" "$vite_plus_ready"
        {
          printf 'node_ready=%s\n' "$node_ready"
          printf 'pnpm_ready=%s\n' "$pnpm_ready"
          printf 'vite_plus_ready=%s\n' "$vite_plus_ready"
        } >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      if: ${{ steps.toolchain.outputs.pnpm_ready != 'true' }}
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.24.0
        run_install: false

    - name: Setup Node
      if: ${{ inputs.setup-node == 'true' && steps.toolchain.outputs.node_ready != 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Prepare executable temporary directory
      id: executable-temp
      if: ${{ steps.toolchain.outputs.vite_plus_ready != 'true' }}
      shell: bash
      run: |
        base="$HOME/.local/share"
        if ! mkdir -p "$base"; then
          echo "::error::Could not create executable Vite+ temporary directory parent: $base"
          exit 1
        fi
        if ! tmpdir=$(mktemp -d "$base/pi-reviewer-XXXXXX"); then
          echo "::error::Could not create executable Vite+ temporary directory under: $base"
          exit 1
        fi
        chmod 700 "$tmpdir"
        probe="$tmpdir/probe"
        printf '#!/bin/sh\nexit 0\n' > "$probe"
        chmod 700 "$probe"
        if "$probe"; then
          rm -f "$probe"
          printf 'path=%s\n' "$tmpdir" >> "$GITHUB_OUTPUT"
        else
          status=$?
          rm -rf "$tmpdir"
          echo "::error::Vite+ temporary directory is not executable: $tmpdir (exit $status)"
          exit 1
        fi

    - name: Setup Vite+
      if: ${{ steps.toolchain.outputs.vite_plus_ready != 'true' }}
      uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
      env:
        TMPDIR: ${{ steps.executable-temp.outputs.path }}
        VP_HOME: ${{ steps.executable-temp.outputs.path }}
      with:
        working-directory: ${{ github.action_path }}
        cache: false
        run-install: false
        node-manager: false

    - name: Verify Node.js version
      shell: bash
      run: |
        major=$(node -p 'process.versions.node.split(".")[0]')
        if [ "$major" -lt 24 ]; then
          echo "::error::pi-reviewer requires Node >= 24 (found $(node -v)). Use setup-node: true or provide Node >= 24."
          exit 1
        fi

    - name: Resolve pnpm store and lockfile hash
      id: pnpm-meta
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "lock-hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-meta.outputs.store-path }}
        key: ${{ runner.os }}-pi-reviewer-pnpm-${{ steps.pnpm-meta.outputs.lock-hash }}
        restore-keys: |
          ${{ runner.os }}-pi-reviewer-pnpm-

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
      working-directory: ${{ github.action_path }}

    - name: Ensure review history
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -f .git/shallow ]; then
          echo "[pi-reviewer] shallow checkout detected; fetching full history"
          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            fetch --unshallow --no-tags origin
        fi

    - name: Run review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PI_API_KEY: ${{ inputs.pi-api-key }}
        REVIEW_DRAFTS: ${{ inputs.review-drafts }}
        PI_REVIEWER_MODEL: ${{ inputs.model }}
        PI_REVIEWER_THINKING: ${{ inputs.thinking }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        REACT_ON_NO_FINDINGS: ${{ inputs.react-on-no-findings }}
        PI_REVIEWER_DOC_DIRS: ${{ inputs.doc-dirs }}
      run: node ${{ github.action_path }}/dist/src/ci/action-entry.js

    - name: Clean up executable temporary directory
      if: ${{ always() && steps.executable-temp.outputs.path != '' }}
      shell: bash
      run: rm -rf -- "${{ steps.executable-temp.outputs.path }}"

branding:
  icon: "eye"
  color: "blue"
