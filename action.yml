name: "pi-reviewer"
description: "AI-powered PR reviewer using the pi agent — model-agnostic"
author: "zeflq"

inputs:
  github-token:
    description: "GitHub token to post PR comments."
    required: true

  pi-api-key:
    description: "API key for the chosen model's provider (e.g. an Anthropic key for anthropic/* models, a DeepSeek key for deepseek/*). Used as the explicit key, overriding per-provider env vars."
    required: true

  model:
    description: "Model to use in provider/modelId format (e.g. openrouter/openai/gpt-5.4-mini)"
    required: true

  thinking:
    description: "Thinking budget: off, minimal, low, medium, high, or xhigh (default: off)"
    required: false
    default: "off"

  post-comment:
    description: "Post review as a GitHub PR comment"
    required: false
    default: "true"

  min-severity:
    description: "Minimum severity level to report: info, warn, or critical (default: info)"
    required: false
    default: "info"

  doc-dirs:
    description: "Comma-separated dirs to scan for matching docs to inject into the review (e.g. '.pi/notes,docs/review'). Empty = inject nothing."
    required: false
    default: ""

  setup-node:
    description: "Set up Node via actions/setup-node. Set to false if the runner image already provides Node."
    required: false
    default: "true"

  cache:
    description: "Cache the pnpm store across runs. Set to false to disable (e.g. on runners where the cache service is unavailable)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.22.0
        run_install: false

    - name: Setup Node
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
      with:
        working-directory: ${{ github.action_path }}
        cache: false
        run-install: false
        node-manager: false

    - name: Resolve pnpm store and lockfile hash
      id: pnpm-meta
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "lock-hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-meta.outputs.store-path }}
        key: ${{ runner.os }}-pi-reviewer-pnpm-${{ steps.pnpm-meta.outputs.lock-hash }}
        restore-keys: |
          ${{ runner.os }}-pi-reviewer-pnpm-

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
      working-directory: ${{ github.action_path }}

    - name: Run review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PI_API_KEY: ${{ inputs.pi-api-key }}
        POST_COMMENT: ${{ inputs.post-comment }}
        PI_REVIEWER_MODEL: ${{ inputs.model }}
        PI_REVIEWER_THINKING: ${{ inputs.thinking }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        PI_REVIEWER_DOC_DIRS: ${{ inputs.doc-dirs }}
      run: node ${{ github.action_path }}/dist/src/ci/action-entry.js

branding:
  icon: "eye"
  color: "blue"
