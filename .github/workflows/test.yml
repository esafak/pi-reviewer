name: Tests

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Ensure bubblewrap for sandbox contract tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y bubblewrap
          fi
          bwrap --version
          # Prove the sandbox substrate itself works before the contract
          # tests run: a failure here (e.g. user namespaces restricted on
          # the runner) would otherwise surface as cryptic exit-code
          # assertions in every live test.
          bwrap --unshare-all --unshare-net --bind / / true && echo BWRAP_SUBSTRATE_OK

      - name: Run tests
        run: vpr test

      - name: Run lint
        run: vpr lint

      - name: Build
        run: vpr build
