name: Pi Reviewer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      min-severity:
        description: Minimum severity to report
        required: false
        default: warn
        type: choice
        options: [info, warn, critical]
      pr-number:
        description: Pull request number to review
        required: false
        type: number
      target-head:
        description: Optional ancestor commit to review
        required: false
        type: string
      thinking:
        description: Thinking budget for this manual run only
        required: false
        default: off
        type: choice
        options: [off, minimal, low, medium, high, xhigh]
      debug:
        description: Upload thinking/action trace artifact for this manual run only
        required: false
        default: false
        type: boolean

# Review every PR update; never abort an in-flight review mid-generation.
concurrency:
  group: pi-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number || github.run_id }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review
    timeout-minutes: 30
    if: (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) && (github.event_name != 'pull_request_review_comment' || github.event.comment.user.type != 'Bot') && (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') && (github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login, 'renovate[bot]')) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'fresnel-deployment-configs[bot]')
    runs-on: ubuntu-latest
    environment: review
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The Review step runs the local action (`uses: ./`). pull_request and
          # pull_request_review_comment check out the PR head; issue_comment and
          # workflow_dispatch have no pull_request payload and fall back to
          # github.sha (default branch), so a comment can never execute PR-owned
          # action code.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch PR refs for comment and manual events
        shell: bash
        run: git fetch origin '+refs/pull/*/head:refs/remotes/origin/pr/*' --no-tags

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: bot-token
        with:
          client-id: ${{ secrets.PI_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.PI_REVIEWER_PK }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Cache Vite+ against the repository checkout. The composite action keeps
      # its own pnpm-store cache because setup-vp cannot reliably hash files
      # from the action checkout.
      - name: Setup Vite+ with cache
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        continue-on-error: true
        with:
          cache: true
          run-install: false
          node-manager: false

      # Dogfood LSP review: preinstall the TS language server (tsc-rs) so the
      # Review step can run it. Pinned in .github/lsp-tools/package.json;
      # Renovate updates it. Mirrors the require-preinstalled policy: the
      # workflow owns binaries, never the action.
      - name: Install LSP servers
        shell: bash
        run: |
          npm ci --prefix .github/lsp-tools --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/lsp-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Select provider API key
        shell: bash
        env:
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -z "$MODEL_NAME" ]; then
            echo "::error::Repository variable MODEL_NAME is required"
            exit 1
          fi
          provider="${MODEL_NAME%%/*}"
          case "$provider" in
            openai) key="$OPENAI_API_KEY" ;;
            anthropic) key="$ANTHROPIC_API_KEY" ;;
            zai) key="$ZAI_API_KEY" ;;
            *) echo "::error::Unsupported provider in MODEL_NAME: $provider"; exit 1 ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::No API key configured for provider: $provider"
            exit 1
          fi
          printf 'PI_API_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Review
        uses: ./
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          pi-api-key: ${{ env.PI_API_KEY }}
          model: ${{ vars.MODEL_NAME }}
          # Manual runs may raise the thinking budget or enable the trace;
          # scheduled PR runs stay at off/false. The `||` fallback covers
          # non-dispatch events where inputs are unset.
          thinking: ${{ inputs.thinking || 'off' }}
          debug: ${{ inputs.debug == true && 'true' || 'false' }}
          review-drafts: false
          min-severity: ${{ inputs.min-severity || 'warn' }}
          github-scope: ${{ vars.PI_REVIEWER_GITHUB_SCOPE }}
          ai-search-provider: ${{ vars.PI_REVIEWER_AI_SEARCH_PROVIDER }}
          search-provider: ${{ vars.PI_REVIEWER_SEARCH_PROVIDER }}
          gh: 'true'
          ai-search: 'true'
          web-search: 'true'
          code-exec: true
          # Keep aligned with .github/mcp.json, which configures the deepwiki server.
          mcp-config-file: .github/mcp.json
          cache: true
          extra-instructions: |
            Use the configured DeepWiki MCP server when upstream project context would help;
            never use MCP documentation to query the repository under review.
