[tools]
hk = "2.4.0"
pnpm = "12.9.0"
vp = "1.0.0"
"npm:renovate" = "latest"

[env]
HK_MISE = "1"

[tasks.lint]
description = "Lint the project with Vite+"
run = "vpr lint"

[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "renovate-config-validator --strict"

[tasks.test]
description = "Run the test suite with Vite+"
run = "vpr test"

[tasks.fmt]
description = "Format the project with Vite+"
run = "vp fmt"

[tasks."hk:install"]
description = "Install the hk git hooks"
run = "hk install --mise"

[tasks."hk:uninstall"]
description = "Uninstall the hk git hooks"
run = "hk uninstall"

[hooks]
postinstall = "mise run hk:install"
